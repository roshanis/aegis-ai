<!-- @dsCard group="Identity" height=120 subtitle="Person, system job, AI agent, pending, future" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ActorMark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
  body { margin: 0; background: var(--surface-page); color: var(--ink); font-family: var(--font-sans); }
  .row { display: flex; gap: 28px; padding: 22px; align-items: flex-start; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 96px; }
  .slot { height: 32px; display: flex; align-items: center; }
  .person { width: 32px; height: 32px; border-radius: 50%; background: var(--seal); color: var(--ink-on-seal); box-shadow: 0 0 0 1px var(--seal-edge); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
  .system { width: 20px; height: 20px; border-radius: 4px; background: var(--actor-system); }
  .agent { box-sizing: border-box; width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--actor-agent); }
  .pending { box-sizing: border-box; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--seal-ring); box-shadow: 0 0 0 5px color-mix(in srgb, var(--seal-ring) 20%, transparent); }
  .future { box-sizing: border-box; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border-control); }
  .name { font-size: 13px; font-weight: 500; }
  .role { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="slot"><span class="person">PR</span></div><span class="name">Priya Raman</span><span class="role">PERSON</span></div>
  <div class="item"><div class="slot"><span class="system"></span></div><span class="name">triage</span><span class="role">SYSTEM JOB</span></div>
  <div class="item"><div class="slot"><span class="agent"></span></div><span class="name">privacy-agent</span><span class="role">AI AGENT</span></div>
  <div class="item"><div class="slot"><span class="pending"></span></div><span class="name">You</span><span class="role">PENDING</span></div>
  <div class="item"><div class="slot"><span class="future"></span></div><span class="name">Approver</span><span class="role">NOT STARTED</span></div>
</div>
</body>
</html>
