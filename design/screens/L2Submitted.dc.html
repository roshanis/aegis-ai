<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CASE-0142 submitted</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; --link: {{t.text}}; --focus: {{t.focus}}; color-scheme: {{t.scheme}}; font-family: 'Geist', system-ui, sans-serif">

<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 20px; padding: 0 40px; border-bottom: 1px solid {{t.line}}">
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px">Aegis</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{t.soft}}">Northwind Health Plan</span>
<div style="flex-grow: 1"></div>
<nav aria-label="Primary" style="display: flex; gap: 4px; font-size: 14px">
<a href="L3Home.dc.html" style="padding: 12px; border-radius: 8px; text-decoration: none; color: {{t.soft}}">Home</a>
<a href="L1Register.dc.html" aria-current="page" style="padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; background: {{t.raised}}">Register</a>
<a href="L4Review.dc.html" style="padding: 12px; border-radius: 8px; text-decoration: none; color: {{t.soft}}">Reviews</a>
<a href="L6Audit.dc.html" style="padding: 12px; border-radius: 8px; text-decoration: none; color: {{t.soft}}">Audit log</a>
</nav>
<span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: {{t.seal}}; color: #0B0E13; box-shadow: 0 0 0 1px {{t.sealEdge}}; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">DO</span>
<span style="font-size: 13px">Dana Ortiz</span>
</header>

<main style="flex-grow: 1; box-sizing: border-box; padding: 48px 40px; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: {{t.ok}}">SUBMITTED · SEP 22, 10:05</div>
<h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 40px">Prior-auth letter summarizer is in review</h1>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: {{t.raised}}; color: {{t.high}}">High risk</span>
<span style="font-size: 14px; padding: 6px 12px; border-radius: 999px; background: {{t.raised}}">8 review teams</span>
<span style="font-size: 14px; padding: 6px 12px; border-radius: 999px; background: {{t.raised}}">Due Sep 29</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: {{t.raised}}">CASE-0142</span>
</div>
</div>

<ol aria-label="Progress" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<li style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center">
<sc-if value="{{s.isSystem}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 5px; background: {{t.system}}"></span></sc-if>
<sc-if value="{{s.isAgent}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="box-sizing: border-box; width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; border: 2px dashed {{t.agent}}"></span></sc-if>
<sc-if value="{{s.isPeople}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="box-sizing: border-box; width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; border: 2px solid {{s.ring}}"></span></sc-if>
<sc-if value="{{s.line}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="flex-grow: 1; height: 2px; margin: 0 12px; background: {{s.lineC}}"></span></sc-if>
</div>
<div style="font-size: 16px; font-weight: 600">{{s.label}}</div>
<div style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{s.statusC}}">{{s.status}}</div>
</li>
</sc-for>
</ol>

<div style="margin-top: auto; display: flex; align-items: center; gap: 12px">
<a href="L3Home.dc.html" style="height: 48px; display: inline-flex; align-items: center; padding: 0 24px; border-radius: 12px; background: {{t.btnBg}}; color: {{t.btnText}}; font-size: 16px; font-weight: 600; text-decoration: none">Done</a>
<a href="L6Audit.dc.html" style="height: 48px; display: inline-flex; align-items: center; padding: 0 20px; border-radius: 12px; border: 1px solid {{t.btn2}}; font-size: 15px; text-decoration: none">Track in audit log</a>
<span style="margin-left: 8px; font-size: 13px; color: {{t.soft}}">We’ll email you at each step.</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","dark","light"],"default":"auto"},"$preview":{"width":1440,"height":900}}'>
var THEMES = {
  dark: { scheme: 'dark', bg: '#0B0E13', panel: '#12161E', raised: '#1A1F2A', line: '#262D3B', text: '#EDE9E0', soft: '#A3ABB9', btnBg: '#D4FF3A', btnText: '#0B0E13', btn2: '#6B7488',
    focus: '#5B9BFF', seal: '#D4FF3A', sealEdge: 'transparent', ring: '#D4FF3A', system: '#8C95A6', agent: '#62D0FF', ok: '#8FE3B5', high: '#FFA36E' },
  light: { scheme: 'light', bg: '#EEECE6', panel: '#FFFFFF', raised: '#F4F2EC', line: '#DCD8CE', text: '#0F1216', soft: '#525964', btnBg: '#0F1216', btnText: '#D4FF3A', btn2: '#858073',
    focus: '#1F5FD6', seal: '#D4FF3A', sealEdge: 'rgba(15,18,22,0.45)', ring: '#4D6B00', system: '#6A7280', agent: '#0070A8', ok: '#1B6B44', high: '#A33A00' }
};
function pickTheme(p) {
  if (THEMES[p]) return THEMES[p];
  try { return window.matchMedia('(prefers-color-scheme: light)').matches ? THEMES.light : THEMES.dark; } catch (e) { return THEMES.dark; }
}
var STEPS = [
  { kind: 'system', label: 'Triage', status: 'DONE', done: true },
  { kind: 'system', label: 'Routing', status: 'DONE', done: true },
  { kind: 'agent', label: 'Agent drafts', status: 'IN PROGRESS' },
  { kind: 'people', label: 'Team sign-offs', status: '0 OF 8', current: true },
  { kind: 'people', label: 'Decision', status: 'AFTER SIGN-OFFS' }
];
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    try { this._mq = window.matchMedia('(prefers-color-scheme: light)'); this._on = function () { self.forceUpdate(); }; this._mq.addEventListener('change', this._on); } catch (e) {}
  }
  componentWillUnmount() { try { this._mq.removeEventListener('change', this._on); } catch (e) {} }
  renderVals() {
    var t = pickTheme(this.props.theme);
    return {
      t: t,
      steps: STEPS.map(function (s, i) {
        return {
          label: s.label, status: s.status, statusC: s.done ? t.ok : t.soft,
          isSystem: s.kind === 'system', isAgent: s.kind === 'agent', isPeople: s.kind === 'people',
          ring: s.current ? t.ring : t.btn2,
          line: i < STEPS.length - 1, lineC: s.done ? t.ok : t.line
        };
      })
    };
  }
}
</script>
</body>
</html>
